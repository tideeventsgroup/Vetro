</defs>
<line x1="46" y1="18" x2="85" y2="95" stroke="#0E7C7B" stroke-width="20" stroke-linecap="round"/>
<line x1="124" y1="18" x2="85" y2="95" stroke="#1F2933" stroke-width="20" stroke-linecap="round"/>
<text x="112" y="95" font-family="'Sora', Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="0" fill="#1F2933">etro</text>
<text x="48" y="122" font-family="'Sora', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="1.5" fill="#0E7C7B">VERIFIED, NOT ASSUMED</text>
</svg>
