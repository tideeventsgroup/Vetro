<svg width="680" height="150" viewBox="0 0 680 150" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Vetro logo</title>
<desc>Vetro logo with a bold two-tone V icon made of two thick angled strokes, teal and dark ink, next to the etro wordmark in Sora typeface, with the tagline verified not assumed below, enlarged.</desc>
<defs>
