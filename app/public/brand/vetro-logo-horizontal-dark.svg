<svg width="300" height="115" viewBox="0 0 300 115" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Vetro logo</title>
<desc>Vetro logo for dark backgrounds: the teal stroke is unchanged; the ink stroke and wordmark invert to white so they don't vanish against a dark surface.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap');</style>
</defs>
<line x1="46" y1="18" x2="85" y2="95" stroke="#0E7C7B" stroke-width="20" stroke-linecap="round"/>
<line x1="124" y1="18" x2="85" y2="95" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
<text x="112" y="95" font-family="'Sora', Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="0" fill="#FFFFFF">etro</text>
</svg>
